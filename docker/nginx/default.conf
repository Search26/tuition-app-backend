upstream api {
    server api:8000;
}

# Request id: keep a safe one from Caddy (production), otherwise use nginx's own.
map $http_x_request_id $req_id {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default $request_id;
}

# The signature in /media/{v|f}/{exp}/{sig}/... is a working credential until exp: never log it.
map $request_uri $log_uri {
    "~^(?<media_head>/media/[vf]/[0-9]+/)[^/]+(?<media_tail>/.*)$" "$media_head-$media_tail";
    default $request_uri;
}

log_format json escape=json '{"ts":"$time_iso8601","request_id":"$req_id",'
    '"client_ip":"$remote_addr","method":"$request_method","uri":"$log_uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

# Per-IP limits. Loose on purpose: many phones share one carrier IP (CGNAT). In production
# $binary_remote_addr is the real client, restored from Caddy's X-Forwarded-For (prod.conf).
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=media:10m rate=50r/s;
limit_req_status 429;

upstream minio {
    server minio:9000;
}

server {
    listen 80;
    access_log /dev/stdout json;

    # Inherited by the API locations below (not by /media/, which sets its own headers).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the API trusts this header for the client IP (login rate
    # limit), so a client-sent X-Forwarded-For must not get through.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;

    error_page 429 = @rate_limited;

    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api;
    }

    location /auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api;
    }

    # Docker and uptime checks poll this; never rate-limit it.
    location = /health {
        proxy_pass http://api;
    }

    # nginx's subrequest target only; the check is never reachable from outside.
    location /internal/ {
        return 404;
    }

    # Signed HLS: /media/{v|f}/{exp}/{sig}/{key}. Every playlist, init file and segment is checked
    # by the API, then fetched from the private bucket with the presigned path the API returns.
    # The client's own path never reaches MinIO.
    location /media/ {
        # nginx's error log quotes the whole request line, signature included (rate limited,
        # denied method, upstream trouble), so it's off here; the JSON access log still shows the
        # status of every media request.
        error_log /dev/stderr crit;
        limit_except GET HEAD {
            deny all;
        }
        limit_req zone=media burst=200 nodelay;
        auth_request /_media_auth;
        auth_request_set $media_path $upstream_http_x_media_path;
        auth_request_set $media_cors $upstream_http_x_media_cors;

        proxy_pass http://minio$media_path;
        proxy_method GET;  # the presign is for GET; nginx drops the body for a client HEAD
        proxy_set_header Host minio:9000;  # the host the presign was made for
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";  # MinIO answers any Origin with its own CORS headers
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-minio-error-code;
        proxy_hide_header x-minio-error-desc;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Vary;
        # MinIO's XML errors never reach the client: a 403 from the check stays a bare 403, a
        # valid token for a missing file is a bare 404.
        proxy_max_temp_file_size 0;  # stream segments to the client instead of spooling to disk
        proxy_intercept_errors on;
        error_page 403 = @media_403;
        error_page 404 = @media_404;
        error_page 429 = @rate_limited;  # a location's error_page replaces the server's

        add_header Cache-Control "private, max-age=3600" always;
        add_header Access-Control-Allow-Origin $media_cors always;  # empty = header not sent
        add_header Vary Origin always;
    }

    location = /_media_auth {
        internal;
        error_log /dev/stderr crit;  # its errors quote the client's signed request line too
        proxy_pass http://api/internal/media-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Request-ID $req_id;
    }

    location @media_403 {
        error_log /dev/stderr crit;
        return 403;
    }

    location @media_404 {
        error_log /dev/stderr crit;
        return 404;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests, try again shortly"}}';
    }
}
