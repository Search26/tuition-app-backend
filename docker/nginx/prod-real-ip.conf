# Production only (mounted by compose.prod.yml). Caddy, at its fixed address, replaces any
# client-sent X-Forwarded-For with the real client IP; trust it from Caddy and nobody else, so
# rate limits, logs and the API's login limit all see the real client.
set_real_ip_from 172.30.0.10;
real_ip_header X-Forwarded-For;
